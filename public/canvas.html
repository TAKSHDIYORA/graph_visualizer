<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title></title>
        <meta name="description" content="">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="">
        <style>
    body {
        margin: 0;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background-color: #121214;
        color: #e2e8f0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
    }

    h1 {
        margin-bottom: 5px;
        font-weight: 600;
        letter-spacing: -0.5px;
    }

    #controls {
        margin: 15px 0;
        display: flex;
        gap: 12px;
    }

    button {
        background-color: #1e1e24;
        color: #3b82f6; /* Modern electric blue accent */
        border: 1px solid #2e2e38;
        padding: 10px 20px;
        border-radius: 8px;
        font-weight: 600;
        font-size: 14px;
        cursor: pointer;
        transition: all 0.2s ease;
    }

    button:hover {
        background-color: #3b82f6;
        color: #ffffff;
        border-color: #3b82f6;
        box-shadow: 0 0 12px rgba(59, 130, 246, 0.4);
    }
    
    #clearBtn {
        color: #ef4444; /* Dark pink/red warn color */
        border-color: rgba(239, 68, 68, 0.2);
    }
    #dfsBtn {
        color: #162c8a; /* Dark pink/red warn color */
        border-color: rgba(239, 68, 68, 0.2);
    }
    #clearBtn:hover {
        background-color: #ef4444;
        color: white;
        box-shadow: 0 0 12px rgba(239, 68, 68, 0.4);
    }

    canvas {
        background-color: #18181c;
        border: 2px solid #2b2b36;
        border-radius: 12px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
</style>
    </head>
    <body>
        <canvas id="myCanvas" width="400" height="300" style="border: 1px solid white; background: #111;"></canvas>
        <button id="clearBtn">clear</button>
        <button id="dfsBtn">DFS</button>
        <button id="bfsBtn">BFS</button>
        <!-- <form> -->
        <label>Set number of colors for mcoloring algorithm</label><input id="setMcolor" type="number" value="2" placeholder="Add number of colors">
         <button id="MColorBtn" type="submit">MColor</button>
        <!-- </form> -->
        <script type="module" src="canvas.mjs">         
        </script>
        <script type="module"  src="dfs.mjs">         
        </script>
        <script type="module"  src="bfs.mjs">         
        </script>
        <script type="module"  src="graphColoring.mjs">         
        </script>
    </body>
</html>
